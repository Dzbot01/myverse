name: recon-scopes
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4b58e4f-myverse
    paths:
      - ".github/workflows/_recon-scopes.yml"

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/c4b58e4f-myverse
      - name: Scope oracle + dark mode capture
        run: |
          cat > /tmp/p15.sh <<'EOS'
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          echo "===== SCOPE ORACLE: bro-fiks-projects ====="
          for p in vtdown portofolio-me-neon-phl portofolio-me-neon vtdownloader portofolio-me portofolio myverse boosteryuk cekidku mr-toolbox jajosteak job-gmail gemasstudio neon-phl phl; do
            for s in bro-fiks-projects bro-fiks dzs-projects dzs-projects-44164dee; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 10 -A "$UA" "https://$p-$s.vercel.app")
              if [ "$code" != "404" ]; then echo "HIT $code $p-$s"; fi
            done
          done
          echo "===== WAYBACK specific hosts ====="
          for u in portofolio-me-neon-phl.vercel.app vtdown.vercel.app vtdownloader.vercel.app portofolio-me.vercel.app; do
            echo "-- $u --"
            curl -s --max-time 15 "http://web.archive.org/cdx/search/cdx?url=$u&output=text&limit=10&fl=timestamp,original,statuscode" | head -n 10
          done
          echo "===== NEON KEYWORD in live portfolio-me page ====="
          curl -s -L --max-time 25 -A "$UA" https://portofolio-me.vercel.app > /tmp/pm.html
          grep -oiE "neon|phl|#[0-9a-f]{6}|glow|text-shadow" /tmp/pm.html | sort | uniq -c | sort -rn | head -n 20
          grep -oE "https?://[A-Za-z0-9._~:/?#@!$&'()*+,;=%-]+" /tmp/pm.html | sed -e 's/[",;]*$//' | sort -u | head -n 30
          EOS
          bash /tmp/p15.sh > /tmp/p15-out.txt 2>&1 || true
      - name: Commit results
        run: |
          mkdir -p .recon
          cp /tmp/p15-out.txt .recon/p15-out.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .recon/p15-out.txt
          git commit -m "chore: recon scopes [skip ci]" || echo "no changes"
          git push origin HEAD:arena/c4b58e4f-myverse
