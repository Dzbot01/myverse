name: recon-vercel
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4b58e4f-myverse
    paths:
      - ".github/workflows/_recon-vercel.yml"

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/c4b58e4f-myverse
      - name: Vercel team-scoped aliases
        run: |
          cat > /tmp/p10.sh <<'EOS'
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          probe () {
            u="$1"
            body=$(curl -s -L --max-time 15 -A "$UA" -w "\n__CODE__%{http_code}" "$u" 2>/dev/null)
            code=$(printf '%s' "$body" | tail -n1 | sed 's/.*__CODE__//')
            title=$(printf '%s' "$body" | tr -d '\r\n' | grep -o -i -m1 "<title[^>]*>[^<]*</title>" | sed -e 's/<[^>]*>//g' | head -c 70)
            echo "$code | $u | $title"
          }
          echo "===== TEAM-SCOPED ALIASES ====="
          for p in vtdown portofolio-me-neon-phl portofolio-me-neon portofolio-me vtdownloader vtdownload mr-toolbox; do
            for t in dzs-projects dzs-projects-44164dee; do
              probe "https://$p-$t.vercel.app"
            done
          done
          echo "===== web.id / my.id ==="
          for u in https://portofolio.web.id https://vtdown.web.id https://portofolio-me-neon.web.id https://portofolio-me-neon-phl.web.id https://vtdown.my.id https://portofolio.my.id https://vtdown.id https://portofolio-me-neon-phl.id https://maxstore.my.id https://dzbot01.github.io ; do
            probe "$u"
          done
          echo "===== OWNERSHIP: portofolio.web.id ====="
          curl -s -L --max-time 25 -A "$UA" https://portofolio.web.id | grep -oE "https?://(www\.)?(github\.com|linkedin\.com|instagram\.com|twitter\.com|x\.com)/[A-Za-z0-9_.-]+" | sort -u | head -n 10
          curl -s -L --max-time 25 -A "$UA" https://portofolio.web.id | tr -d '\r\n' | grep -o -i -m1 "<title[^>]*>[^<]*</title>"
          echo "===== GH PAGES dzbot01 repos ====="
          for r in vtdown portofolio-me-neon-phl portofolio-me-neon; do
            probe "https://dzbot01.github.io/$r/"
          done
          EOS
          bash /tmp/p10.sh > /tmp/p10-out.txt 2>&1 || true
      - name: Commit results
        run: |
          mkdir -p .recon
          cp /tmp/p10-out.txt .recon/p10-out.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .recon/p10-out.txt
          git commit -m "chore: recon vercel aliases [skip ci]" || echo "no changes"
          git push origin HEAD:arena/c4b58e4f-myverse
