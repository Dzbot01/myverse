name: prod-check-experience
on:
  workflow_dispatch:
  push:
    branches:
      - arena/af6286dd-myverse
    paths:
      - ".github/workflows/prod-check-experience.mjs"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/af6286dd-myverse
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -D playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node .github/workflows/prod-check-experience.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .recon/prod
          git commit -m "chore: prod check [skip ci]" || echo "no changes"
          for i in 1 2 3 4 5; do
            git push origin HEAD:arena/af6286dd-myverse && break
            echo "push failed, retry $i"
            git fetch origin arena/af6286dd-myverse && git rebase FETCH_HEAD || true
            sleep 5
          done
