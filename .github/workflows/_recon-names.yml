name: recon-names
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4b58e4f-myverse
    paths:
      - ".github/workflows/_recon-names.yml"

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/c4b58e4f-myverse
      - name: Name oracle sweep
        run: |
          cat > /tmp/p16.sh <<'EOS'
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          S="dzs-projects-44164dee"
          echo "===== ORACLE: wide project-name dictionary ====="
          for p in snapgram snapgram-io snapgramio ig-downloader igdownloader instagram-downloader \
            vidmate ssaver snaptik tiktok-downloader ttdownloader \
            vt vtmedia vtd vtdl vt-download vid-download videodownloader media-downloader \
            portofolio-webid portofoliowebid webid portofolio-web-id \
            portfolio portfolio-neon neon portofolio-me-neon-phl phl \
            myverse myversedev dzs dzbot bot tele temadz web2app hitori maxstore max-store \
            bdps bdpsukses gemas gemasstudio gn-dlab gndlab snapsnap snipgrab \
            vtdown-app vtdown2 vt-dl vtdl-app vtvid vtvideo vstream media-grabber \
            grab grabber vidgrab savefrom y2mate snapdown snaptube ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 8 -A "$UA" "https://$p-$S.vercel.app")
            if [ "$code" != "404" ]; then echo "TEAM-HIT $code $p"; fi
          done
          echo "===== SNAPGRAM OWNERSHIP ====="
          for u in https://snapgram.io https://snapgram.vercel.app ; do
            echo "--- $u ---"
            curl -s -L --max-time 25 -A "$UA" "$u" | grep -oE "https?://(www\.)?(github\.com|instagram\.com|linkedin\.com|twitter\.com|x\.com)/[A-Za-z0-9_.-]+" | sort -u | head -n 6
            curl -s -L --max-time 25 -A "$UA" "$u" | tr -d '\r\n' | grep -o -i -m1 "<title[^>]*>[^<]*</title>"
          done
          echo "===== REPO OWNER CHECK for vtdownloader content ====="
          curl -s --max-time 20 -A "$UA" https://vtdownloader.vercel.app | grep -oiE "reliable media downloader|premium social media downloader|generate ?link|vtdownload" | sort | uniq -c | head
          EOS
          bash /tmp/p16.sh > /tmp/p16-out.txt 2>&1 || true
      - name: Commit results
        run: |
          mkdir -p .recon
          cp /tmp/p16-out.txt .recon/p16-out.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .recon/p16-out.txt
          git commit -m "chore: recon names [skip ci]" || echo "no changes"
          git push origin HEAD:arena/c4b58e4f-myverse
