name: recon-final
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4b58e4f-myverse
    paths:
      - ".github/workflows/_recon-final.yml"

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/c4b58e4f-myverse
      - name: Final probe
        run: |
          cat > /tmp/p8.sh <<'EOS'
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          probe () {
            u="$1"
            body=$(curl -s -L --max-time 15 -A "$UA" -w "\n__CODE__%{http_code}" "$u" 2>/dev/null)
            code=$(printf '%s' "$body" | tail -n1 | sed 's/.*__CODE__//')
            title=$(printf '%s' "$body" | tr -d '\r\n' | grep -o -i -m1 "<title[^>]*>[^<]*</title>" | sed -e 's/<[^>]*>//g' | head -c 70)
            echo "$code | $u | $title"
          }
          echo "===== NON-200 CANDIDATES ====="
          for p in vtdown vt-down vtdownloader vtdownload vt-downloader portofolio-me-neon-phl portofolio-me-neon portofolio-me portofolio-phl neon-phl temadz web2app bot-tele hitori max-store maxstore; do
            for t in my.id id com co.id web.id sch.id netlify.app pages.dev web.app vercel.app github.io now.sh; do
              r=$(probe "https://$p.$t")
              code=$(printf '%s' "$r" | cut -d'|' -f1 | tr -d ' ')
              if [ "$code" != "404" ] && [ "$code" != "000" ] && [ -n "$code" ]; then echo "$r"; fi
            done
          done
          echo "===== CRTSH ====="
          for q in vtdown portofolio-me-neon-phl portofolio-me-neon dzbot01; do
            echo "-- $q --"
            curl -s --max-time 30 "https://crt.sh/?q=%25.$q&output=json" | head -c 1500
            echo
          done
          echo "===== WAYBACK .my.id candidates ====="
          for u in vtdown.my.id portofolio-me-neon-phl.my.id temadz.my.id web2app.my.id bot-tele.my.id hitori.my.id max-store.my.id; do
            r=$(curl -s --max-time 12 "http://archive.org/wayback/available?url=$u")
            echo "$u -> $r"
          done
          EOS
          bash /tmp/p8.sh > /tmp/p8-out.txt 2>&1 || true
      - name: Commit results
        run: |
          mkdir -p .recon
          cp /tmp/p8-out.txt .recon/p8-out.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .recon/p8-out.txt
          git commit -m "chore: recon final [skip ci]" || echo "no changes"
          git push origin HEAD:arena/c4b58e4f-myverse
