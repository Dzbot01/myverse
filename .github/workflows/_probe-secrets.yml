name: probe-secrets
on:
  workflow_dispatch:
  push:
    branches:
      - arena/11235259-myverse
    paths:
      - ".github/workflows/_probe-secrets.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: cek secret
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          {
            echo "VERCEL_TOKEN set: $([ -n "$VERCEL_TOKEN" ] && echo yes || echo no)"
            echo "VERCEL_ORG_ID set: $([ -n "$VERCEL_ORG_ID" ] && echo yes || echo no)"
            echo "VERCEL_PROJECT_ID set: $([ -n "$VERCEL_PROJECT_ID" ] && echo yes || echo no)"
            echo "DEPLOY_HOOK set: $([ -n "$DEPLOY_HOOK" ] && echo yes || echo no)"
          } > probe.txt
      - name: Commit hasil probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f probe.txt
          git commit -m "chore: probe result [skip ci]" || echo "no changes"
          for i in 1 2 3 4 5; do
            git push origin HEAD:arena/11235259-myverse && break
            echo "push failed, retry $i"
            git fetch origin arena/11235259-myverse && git rebase FETCH_HEAD || true
            sleep 5
          done
