name: probe-secrets
on:
  workflow_dispatch:
  push:
    branches:
      - arena/11235259-myverse
    paths:
      - ".github/workflows/_probe-secrets.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/11235259-myverse
      - name: cek secret
        run: |
          {
            echo "VERCEL_TOKEN set: $([ -n "$VERCEL_TOKEN" ] && echo yes || echo no)"
            echo "VERCEL_ORG_ID set: $([ -n "$VERCEL_ORG_ID" ] && echo yes || echo no)"
            echo "VERCEL_PROJECT_ID set: $([ -n "$VERCEL_PROJECT_ID" ] && echo yes || echo no)"
            echo "VERCEL_DEPLOY_HOOK set: $([ -n "$VERCEL_DEPLOY_HOOK" ] && echo yes || echo no)"
          } > probe.txt || true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      - name: Commit hasil probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A probe.txt || true
          git commit -m "chore: probe result [skip ci]" || echo "no changes"
          ok=0
          for i in 1 2 3 4 5; do
            if git push origin HEAD:arena/11235259-myverse; then ok=1; break; fi
            echo "push failed, retry $i"
            git fetch origin arena/11235259-myverse || true
            git rebase FETCH_HEAD || true
            sleep 5
          done
          test "$ok" = "1"
