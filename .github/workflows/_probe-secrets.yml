name: probe-secrets
on:
  workflow_dispatch:
  push:
    branches:
      - arena/11235259-myverse
    paths:
      - ".github/workflows/_probe-secrets.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: cek secret
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          {
            echo "VERCEL_TOKEN set: $([ -n "$VERCEL_TOKEN" ] && echo yes || echo no)"
            echo "VERCEL_ORG_ID set: $([ -n "$VERCEL_ORG_ID" ] && echo yes || echo no)"
            echo "VERCEL_PROJECT_ID set: $([ -n "$VERCEL_PROJECT_ID" ] && echo yes || echo no)"
            echo "DEPLOY_HOOK set: $([ -n "$DEPLOY_HOOK" ] && echo yes || echo no)"
          } > probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe.txt
          if-no-files-found: error
