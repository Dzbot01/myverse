name: recon-oracle
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4b58e4f-myverse
    paths:
      - ".github/workflows/_recon-oracle.yml"

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/c4b58e4f-myverse
      - name: Oracle sweep
        run: |
          cat > /tmp/p12.sh <<'EOS'
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          probe () {
            u="$1"
            out=$(curl -s -L --max-time 12 -A "$UA" -w "\n__CODE__%{http_code}" "$u" 2>/dev/null)
            code=$(printf '%s' "$out" | tail -n1 | sed 's/.*__CODE__//')
            title=$(printf '%s' "$out" | tr -d '\r\n' | grep -o -i -m1 "<title[^>]*>[^<]*</title>" | sed -e 's/<[^>]*>//g' | head -c 55)
            echo "$code|$u|$title"
          }
          echo "===== ORACLE VALIDATION (known projects) ====="
          for p in boosteryuk mr-toolbox cekidku jajosteak job-gmail gemastudio myverse gn-d vtdownloader portofolio portofolio-me; do
            probe "https://$p-dzs-projects-44164dee.vercel.app"
          done
          echo "===== ORACLE SWEEP: VIDEO DOWNLOADER NAMES ====="
          for p in vtdown vtdownload vt-dl vtdl vtmedia vtvid vtvideo vt-app vtdown-app vt-down-app tiktok-downloader tiktokdownloader vid-downloader social-downloader downloader media-downloader snapgram snapgram-io vtmedia-downloader vtstream vdownload vdown dl-video vdownload-app videodownloader; do
            r=$(probe "https://$p-dzs-projects-44164dee.vercel.app")
            c=$(printf '%s' "$r" | cut -d'|' -f1)
            if [ "$c" != "404" ]; then echo "TEAM-HIT $r"; fi
          done
          echo "===== ORACLE SWEEP: PORTFOLIO NAMES ====="
          for p in portofolio-me-neon-phl portofolio-me-neon portofolio-neon-phl neon-phl portofolio-phl portfolio-me-neon portfolio-neon-phl portofolio-me-phl portofolio-neon portofolio-ph-l phl-portofolio my-portofolio portofolio-personal neonportofolio portofolio-neon-phl-2 portofolio-me-neon-phl-2; do
            r=$(probe "https://$p-dzs-projects-44164dee.vercel.app")
            c=$(printf '%s' "$r" | cut -d'|' -f1)
            if [ "$c" != "404" ]; then echo "TEAM-HIT $r"; fi
          done
          echo "===== GLOBAL OWNERSHIP: vtdownloader + portofolio-me ====="
          for u in https://vtdownloader.vercel.app https://portofolio-me.vercel.app https://portofolio.vercel.app https://vtdownload.vercel.app https://vt-downloader.vercel.app; do
            echo "--- $u ---"
            curl -s -L --max-time 25 -A "$UA" "$u" | grep -oE "https?://(www\.)?(github\.com|linkedin\.com|instagram\.com|twitter\.com|x\.com|facebook\.com)/[A-Za-z0-9_.-]+" | sort -u | head -n 8
            curl -s -L --max-time 25 -A "$UA" "$u" | grep -oiE "(dzbot01|dzbot|boosteryuk|cekidku|maxstore)[A-Za-z0-9_.-]*" | sort -u | head -n 5
          done
          EOS
          bash /tmp/p12.sh > /tmp/p12-out.txt 2>&1 || true
      - name: Commit results
        run: |
          mkdir -p .recon
          cp /tmp/p12-out.txt .recon/p12-out.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .recon/p12-out.txt
          git commit -m "chore: recon oracle [skip ci]" || echo "no changes"
          git push origin HEAD:arena/c4b58e4f-myverse
