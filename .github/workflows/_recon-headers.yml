name: recon-headers
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4b58e4f-myverse
    paths:
      - ".github/workflows/_recon-headers.yml"

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/c4b58e4f-myverse
      - name: Headers + big oracle
        run: |
          cat > /tmp/p13.sh <<'EOS'
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          hdr () {
            u="$1"
            echo "===== $u ====="
            curl -s -L -I --max-time 20 -A "$UA" "$u" | grep -iE "^(x-vercel|x-matched|x-vercel-deployment|server|location|x-powered|set-cookie: __vercel)" | head -n 12
          }
          for u in https://boosteryuk.com https://boosteryuk.vercel.app https://mr-toolbox.vercel.app https://vtdownloader.vercel.app https://portofolio-me.vercel.app https://portofolio.vercel.app https://jajosteak.vercel.app https://job-gmail.vercel.app https://myversedev.vercel.app ; do
            hdr "$u"
          done
          echo "===== BIG ORACLE (team dzs-projects) ====="
          for p in vtdown vtdownloader vtdownload vt-downloader vtmedia vtvid vtvideo portofolio portofolio-me portofolio-me-neon portofolio-neon portofolio-me-neon-phl portofolio-neon-phl neon-portfolio neonportofolio porto-neon portfolio-neon phl-neon my-portofolio portfolio-me portfolio portofolio-phl neon-phl-neon web2app temadz bot-tele hitori maxstore max-store gemasstudio gemas-rnd gn-d bdps hardworking snaptiktok snapgram ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 10 -A "$UA" "https://$p-dzs-projects-44164dee.vercel.app")
            if [ "$code" != "404" ]; then echo "TEAM-HIT $code $p"; fi
          done
          EOS
          bash /tmp/p13.sh > /tmp/p13-out.txt 2>&1 || true
      - name: Commit results
        run: |
          mkdir -p .recon
          cp /tmp/p13-out.txt .recon/p13-out.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .recon/p13-out.txt
          git commit -m "chore: recon headers [skip ci]" || echo "no changes"
          git push origin HEAD:arena/c4b58e4f-myverse
