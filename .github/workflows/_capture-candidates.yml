name: capture-candidates
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4b58e4f-myverse
    paths:
      - ".github/workflows/_capture-candidates.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/c4b58e4f-myverse
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install playwright@1.49.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Capture
        run: node .github/workflows/capture-candidates.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .recon/candidates || true
          git commit -m "chore: candidate screenshots [skip ci]" || echo "no changes"
          git push origin HEAD:arena/c4b58e4f-myverse
