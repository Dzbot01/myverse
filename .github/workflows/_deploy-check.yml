name: deploy-check
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4b58e4f-myverse
    paths:
      - ".github/workflows/_deploy-check.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/c4b58e4f-myverse
      - name: Check deployed preview serves the screenshots
        run: |
          {
            URL="https://myversedev-git-arena-c4b58e4f-myverse-dzs-projects-44164dee.vercel.app"
            echo "=== $URL ==="
            curl -s -L --max-time 45 -A "Mozilla/5.0" "$URL/" -o /tmp/dep.html -w "page http=%{http_code} bytes=%{size_download}\n"
            echo "--- image refs found in deployed page ---"
            grep -oE "assets/projects/[0-9]{2}-[a-z-]+\.jpg" /tmp/dep.html | sort -u
            echo "--- fetching each ---"
            for f in $(grep -oE "assets/projects/[0-9]{2}-[a-z-]+\.jpg" /tmp/dep.html | sort -u); do
              curl -s -L --max-time 45 -A "Mozilla/5.0" -o /tmp/img.jpg -w "$f http=%{http_code} bytes=%{size_download} type=%{content_type}\n" "$URL/$f"
            done
          } > /tmp/dep-out.txt 2>&1 || true
          cat /tmp/dep-out.txt
      - name: Commit
        run: |
          mkdir -p .recon/deploy
          cp /tmp/dep-out.txt .recon/deploy/out.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .recon/deploy
          git commit -m "chore: deploy check [skip ci]" || echo "no changes"
          for i in 1 2 3 4 5; do
            git push origin HEAD:arena/c4b58e4f-myverse && break
            echo "push failed, retry $i"
            git pull --rebase origin arena/c4b58e4f-myverse || true
            sleep 5
          done
