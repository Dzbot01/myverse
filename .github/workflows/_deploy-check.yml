name: deploy-check
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4b58e4f-myverse
    paths:
      - ".github/workflows/_deploy-check.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/c4b58e4f-myverse
      - name: Check deployed preview serves the screenshots
        run: |
          {
            for URL in \
              "https://myversedev-git-arena-c4b58e4f-myverse-dzs-projects-44164dee.vercel.app" \
              "https://myversedev.vercel.app" ; do
              echo "=== $URL ==="
              curl -s -L --max-time 60 -A "Mozilla/5.0" "$URL/" -o /tmp/dep.html -w "page http=%{http_code} bytes=%{size_download}\n"
              echo "--- markers ---"
              echo -n "title: "; grep -o -m1 "<title>[^<]*</title>" /tmp/dep.html
              echo -n "has assets/projects refs: "; grep -coE "assets/projects/[0-9]{2}-[a-z-]+\.jpg" /tmp/dep.html
              echo -n "has Placeholder text: "; grep -co "Placeholder" /tmp/dep.html
              echo -n "has real img alt: "; grep -co "Tangkapan layar website" /tmp/dep.html
              echo -n "domain labels present: "; grep -oE "vtdownloader\.vercel\.app|portofolio-me\.vercel\.app|vtdown|portofolio-me-neon-phl" /tmp/dep.html | sort -u | tr '\n' ' '; echo
              echo "--- fetching each referenced image ---"
              for f in $(grep -oE "assets/projects/[0-9]{2}-[a-z-]+\.jpg" /tmp/dep.html | sort -u); do
                curl -s -L --max-time 60 -A "Mozilla/5.0" -o /tmp/img.bin -w "$f http=%{http_code} bytes=%{size_download} type=%{content_type}\n" "$URL/$f"
              done
              echo
            done
          } > /tmp/dep-out.txt 2>&1 || true
          cat /tmp/dep-out.txt
      - name: Commit
        run: |
          mkdir -p .recon/deploy
          cp /tmp/dep-out.txt .recon/deploy/out.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .recon/deploy
          git commit -m "chore: deploy check [skip ci]" || echo "no changes"
          for i in 1 2 3 4 5; do
            git push origin HEAD:arena/c4b58e4f-myverse && break
            echo "push failed, retry $i"
            git pull --rebase origin arena/c4b58e4f-myverse || true
            sleep 5
          done
