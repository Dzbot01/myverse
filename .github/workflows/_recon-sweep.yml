name: recon-sweep
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4b58e4f-myverse
    paths:
      - ".github/workflows/_recon-sweep.yml"

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/c4b58e4f-myverse
      - name: Sweep Vercel project names
        run: |
          cat > /tmp/p11.sh <<'EOS'
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          probe () {
            u="$1"
            out=$(curl -s -L --max-time 12 -A "$UA" -w "\n__CODE__%{http_code}" "$u" 2>/dev/null)
            code=$(printf '%s' "$out" | tail -n1 | sed 's/.*__CODE__//')
            title=$(printf '%s' "$out" | tr -d '\r\n' | grep -o -i -m1 "<title[^>]*>[^<]*</title>" | sed -e 's/<[^>]*>//g' | head -c 60)
            if [ "$code" != "404" ]; then echo "$code | $u | $title"; fi
          }
          echo "===== CONTROL TEST (must be 404 if 'Login' is generic) ====="
          probe "https://zzqx-nonexistent-xyz123-dzs-projects-44164dee.vercel.app"
          probe "https://zzqx-nonexistent-xyz123.vercel.app"
          probe "https://mr-toolbox-dzs-projects.vercel.app"
          echo "===== TEAM-SCOPED SWEEP ====="
          for p in vtdown vtdownloader vtdownload vt-downloader vt-dl portofolio portofolio-me portofolio-me-neon portofolio-me-neon-phl portofolio-phl neon-phl portfolio-me-neon-phl mr-toolbox temadz web2app bot-tele hitori max-store maxstore gemasstudio gemas-rnd gndlab bdpsukes cekidku boosteryuk jajosteak job-gmail myverse vtdown-app vtdown-web; do
            probe "https://$p-dzs-projects-44164dee.vercel.app"
          done
          echo "===== GLOBAL SWEEP (non-404 only) ====="
          for p in vtdown vtdownloader vtdownload vt-downloader portofolio portofolio-me portofolio-me-neon portofolio-me-neon-phl neon-phl portfolio-neon-phl vtdown-app vtdown-my-id vtdown-web vtdown-id; do
            probe "https://$p.vercel.app"
          done
          EOS
          bash /tmp/p11.sh > /tmp/p11-out.txt 2>&1 || true
      - name: Commit results
        run: |
          mkdir -p .recon
          cp /tmp/p11-out.txt .recon/p11-out.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .recon/p11-out.txt
          git commit -m "chore: recon sweep [skip ci]" || echo "no changes"
          git push origin HEAD:arena/c4b58e4f-myverse
