name: recon-supabase
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4b58e4f-myverse
    paths:
      - ".github/workflows/_recon-supabase.yml"

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/c4b58e4f-myverse
      - name: Query Supabase
        run: |
          cat > /tmp/p7.sh <<'EOS'
          K="sb_publishable_5rQxfGd82O_EooSxxBkcRw_S5ATDox0"
          U="https://zcxtbtleeeaeqeryiwea.supabase.co"
          echo "===== Video table ====="
          curl -s --max-time 30 "$U/rest/v1/Video?select=*" -H "apikey: $K" -H "Authorization: Bearer $K" | head -c 6000
          echo
          echo "===== storage bucket list video ====="
          curl -s --max-time 30 "$U/storage/v1/object/list/video" -H "apikey: $K" -H "Authorization: Bearer $K" | head -c 6000
          echo
          echo "===== openapi tables ====="
          curl -s --max-time 30 "$U/rest/v1/" -H "apikey: $K" -H "Authorization: Bearer $K" | head -c 6000
          echo
          EOS
          bash /tmp/p7.sh > /tmp/p7-out.txt 2>&1 || true
      - name: Commit results
        run: |
          mkdir -p .recon
          cp /tmp/p7-out.txt .recon/p7-out.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .recon/p7-out.txt
          git commit -m "chore: recon supabase [skip ci]" || echo "no changes"
          git push origin HEAD:arena/c4b58e4f-myverse
