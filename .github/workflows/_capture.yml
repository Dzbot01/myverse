name: capture-screenshots
on:
  push:
    branches:
      - arena/c4b58e4f-myverse
    paths:
      - ".github/workflows/_capture.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/c4b58e4f-myverse
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install playwright@1.49.1 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: node .github/workflows/capture.mjs

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public/assets || true
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "chore: refresh project screenshots [skip ci]"
            git push origin HEAD:arena/c4b58e4f-myverse
          fi
