name: final
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4b58e4f-myverse
    paths:
      - ".github/workflows/final.mjs"
      - ".github/workflows/_final.yml"

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/c4b58e4f-myverse
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -D playwright@1.49.1 && npx playwright install --with-deps chromium

      - name: Probe deployed myverse bundle for original project URLs
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          {
            echo "===== DEPLOYED MYVERSE BUNDLE URLS ====="
            curl -s -L --max-time 40 -A "$UA" https://myversedev.vercel.app/ -o /tmp/mv.html
            echo "size: $(wc -c < /tmp/mv.html)"
            grep -oE "https?://[A-Za-z0-9._~:/?#@!$&'()*+,;=%-]{5,90}" /tmp/mv.html \
              | grep -viE "w3\.org|schema|reactjs|googleapis|gstatic|react\.dev|vercel\.app/insights" \
              | sort -u
            echo "===== VERCELEIMPLIKASI PROJECTS ARRAY SNIPPET ====="
            grep -oE "domain:\"[^\"]+\"" /tmp/mv.html | sort -u
            echo "===== PROJECT-LIKE SLUGS ====="
            grep -oE "[a-z0-9-]+\.(vercel\.app|my\.id|web\.id)" /tmp/mv.html | sort -u | head -n 60
          } > /tmp/final-out.txt 2>&1 || true
          cat /tmp/final-out.txt

      - name: Probe alias variants
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          {
            echo "===== ALIAS VARIANT PROBE ====="
            for p in portofolio-me-neon-phl portofolio-me-neon neon-phl portfolio-neon-phl vtdown vtdownloader; do
              for s in dzs-projects-44164dee bro-fiks-projects; do
                code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 10 -A "$UA" "https://$p-$s.vercel.app/")
                if [ "$code" != "404" ]; then echo "ALIAS-HIT $code $p-$s"; fi
              done
            done
            echo "===== DZSGITHUB PAGES ====="
            for r in myverse Boosteryuk JobGmail Jajo-Steak Cek-pesanan MAX-STORE Web2app Temadz Auto-deploy Bot-tele GnDLab boosteryuk.com; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 10 -A "$UA" "https://dzbot01.github.io/$r/")
              echo "$code https://dzbot01.github.io/$r/"
            done
          } >> /tmp/final-out.txt 2>&1 || true

      - run: node .github/workflows/final.mjs

      - name: Commit
        run: |
          mkdir -p .recon/final
          cp /tmp/final-out.txt .recon/final/probe.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .recon/final
          git commit -m "chore: final recon [skip ci]" || echo "no changes"
          for i in 1 2 3 4 5; do
            git push origin HEAD:arena/c4b58e4f-myverse && break
            echo "push failed, retry $i"
            git pull --rebase origin arena/c4b58e4f-myverse || true
            sleep 5
          done
