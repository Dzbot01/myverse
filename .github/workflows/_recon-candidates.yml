name: recon-candidates
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4b58e4f-myverse
    paths:
      - ".github/workflows/_recon-candidates.yml"

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/c4b58e4f-myverse
      - name: Candidates + live domain list
        run: |
          cat > /tmp/p14.sh <<'EOS'
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          echo "===== FULL DOMAIN LIST IN LIVE MYVERSE ====="
          curl -s -L --max-time 30 -A "$UA" https://myversedev.vercel.app > /tmp/mv.html
          grep -oE "[a-z0-9][a-z0-9-]{1,40}(\.[a-z0-9-]{1,20}){1,3}\.(com|app|id|io|net|org|dev|xyz|site|me|cc|link|blog|top|live|fun|tools|space|online|shop|store|tech|pro)" /tmp/mv.html | sort -u | grep -vE "^(react|supabase|vercel|github|picsum|www\.|w3\.org|localhost)" | head -n 60
          echo "===== SNAPGRAM + CANDIDATES ====="
          for u in https://snapgram.io https://snapgram.vercel.app https://snapgram-io.vercel.app https://snapgram.my.id https://portofolio-me-neon.vercel.app https://portofolio-neon.vercel.app https://portofolio.web.id/portofolio ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 -A "$UA" "$u")
            title=$(curl -s -L --max-time 15 -A "$UA" "$u" | tr -d '\r\n' | grep -o -i -m1 "<title[^>]*>[^<]*</title>" | sed -e 's/<[^>]*>//g' | head -c 60)
            echo "$code | $u | $title"
          done
          echo "===== NEON CHECK: any project in team with 'neon' ====="
          for p in portofolio-neon-phl portofolio-me-neon-phl neon-phl portofolio-neon portofolio-me-neon portfolio-neon phl-neon neon-portofolio-myver portfolio-neon-phl myver-neon neon-portfolio-phl ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 10 -A "$UA" "https://$p-dzs-projects-44164dee.vercel.app")
            if [ "$code" != "404" ]; then echo "TEAM-HIT $code $p"; fi
          done
          echo "===== TEAMS PROJECTS: try other team slugs ====="
          for team in dzs-projects dzbot01 dz-bot dzbot dzsprojects; do
            for p in vtdown portofolio-me-neon-phl; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 10 -A "$UA" "https://$p-$team.vercel.app")
              if [ "$code" != "404" ]; then echo "HIT $code $p-$team"; fi
            done
          done
          EOS
          bash /tmp/p14.sh > /tmp/p14-out.txt 2>&1 || true
      - name: Commit results
        run: |
          mkdir -p .recon
          cp /tmp/p14-out.txt .recon/p14-out.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .recon/p14-out.txt
          git commit -m "chore: recon candidates [skip ci]" || echo "no changes"
          git push origin HEAD:arena/c4b58e4f-myverse
