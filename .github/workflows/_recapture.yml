name: recapture
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4b58e4f-myverse
    paths:
      - ".github/workflows/recapture.mjs"

permissions:
  contents: write

jobs:
  recapture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/c4b58e4f-myverse
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -D playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node .github/workflows/recapture.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .recon/recapture
          git commit -m "chore: recapture with modals closed [skip ci]" || echo "no changes"
          for i in 1 2 3 4 5; do
            git push origin HEAD:arena/c4b58e4f-myverse && break
            echo "push failed, retry $i"
            git pull --rebase origin arena/c4b58e4f-myverse || true
            sleep 5
          done
