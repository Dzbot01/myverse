name: recon
on:
  workflow_dispatch:
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Check candidate URLs
        run: |
          for u in \
            https://boosteryuk.com \
            https://job-gmail.vercel.app \
            https://bdpsukses.my.id \
            https://jajosteak.vercel.app \
            https://cekidku.my.id \
            https://gemasstudio.vercel.app \
            https://mr-toolbox.vercel.app \
            https://portofolio-me-neon-phl.vercel.app \
            https://vtdown.vercel.app \
            https://vtdown.web.app \
            https://vtdown.netlify.app \
            https://vtdown.pages.dev \
            https://vtdown.my.id \
            https://vtdown.id \
            https://www.vtdown.id \
            https://vtdown.my.id/ \
            https://vtdown.vercel.app/ ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 25 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36" "$u")
            title=$(curl -s -L --max-time 25 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36" "$u" | tr -d '\n' | grep -o -i -m1 "<title>[^<]*</title>" | head -n1)
            echo "RESULT $code | $u | $title"
          done
