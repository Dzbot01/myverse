name: verify
on:
  workflow_dispatch:
  push:
    branches:
      - ${{ github.ref_name }}
    paths:
      - ".github/workflows/verify.yml"
      - ".github/workflows/verify.mjs"
      - "src/App.tsx"
      - "assets/projects/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - run: npm i -D playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Serve build
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
      - run: node .github/workflows/verify.mjs
      - name: Upload hasil verifikasi
        uses: actions/upload-artifact@v4
        with:
          name: project-verify
          path: .recon/verify
          if-no-files-found: error
