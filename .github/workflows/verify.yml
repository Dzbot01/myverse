name: verify
on:
  workflow_dispatch:
  push:
    branches:
      - arena/11235259-myverse
    paths:
      - ".github/workflows/verify.yml"
      - ".github/workflows/verify.mjs"
      - "src/App.tsx"
      - "assets/projects/**"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/11235259-myverse
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - run: npm i -D playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Serve build
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
      - run: node .github/workflows/verify.mjs
      - name: Commit hasil verifikasi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .recon/verify
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: verify project page [skip ci]"
          fi
          ok=0
          for i in 1 2 3 4 5; do
            if git push origin HEAD:arena/11235259-myverse; then ok=1; break; fi
            echo "push failed, retry $i"
            git fetch origin arena/11235259-myverse
            git rebase FETCH_HEAD || true
            sleep 5
          done
          test "$ok" = "1"
