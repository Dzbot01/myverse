name: capture-logos
on:
  workflow_dispatch:
  push:
    branches:
      - arena/af6286dd-myverse
    paths:
      - ".github/workflows/capture-logos.mjs"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/af6286dd-myverse
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -D playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node .github/workflows/capture-logos.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .recon/logos
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: logo candidates [skip ci]"
          fi
          ok=0
          for i in 1 2 3 4 5; do
            if git push origin HEAD:arena/af6286dd-myverse; then ok=1; break; fi
            echo "push failed, retry $i"
            git fetch origin arena/af6286dd-myverse
            git rebase FETCH_HEAD || true
            sleep 5
          done
          test "$ok" = "1"
