name: prod-check
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4b58e4f-myverse
    paths:
      - ".github/workflows/_prod-check.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/c4b58e4f-myverse
      - name: Check production serves the screenshots
        run: |
          {
            URL="https://myversedev.vercel.app"
            echo "=== $URL ==="
            curl -s -L --max-time 60 -A "Mozilla/5.0" "$URL/" -o /tmp/prod.html -w "page http=%{http_code} bytes=%{size_download}\n"
            echo -n "has real img alt: "; grep -co "Tangkapan layar website" /tmp/prod.html
            echo -n "has Placeholder text: "; grep -co "Placeholder" /tmp/prod.html
            echo "--- image refs ---"
            grep -oE "assets/projects/[0-9]{2}-[a-z-]+\.jpg" /tmp/prod.html | sort -u
            echo "--- fetching each ---"
            for f in $(grep -oE "assets/projects/[0-9]{2}-[a-z-]+\.jpg" /tmp/prod.html | sort -u); do
              curl -s -L --max-time 60 -A "Mozilla/5.0" -o /tmp/i.bin -w "$f http=%{http_code} bytes=%{size_download} type=%{content_type}\n" "$URL/$f"
            done
          } > /tmp/prod-out.txt 2>&1 || true
          cat /tmp/prod-out.txt
      - name: Commit
        run: |
          mkdir -p .recon/prod
          cp /tmp/prod-out.txt .recon/prod/out.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .recon/prod
          git commit -m "chore: prod check [skip ci]" || echo "no changes"
          for i in 1 2 3 4 5; do
            git push origin HEAD:arena/c4b58e4f-myverse && break
            echo "push failed, retry $i"
            git pull --rebase origin arena/c4b58e4f-myverse || true
            sleep 5
          done
